# Codemagic build configuration for HomeKind.
#
# There is no Mac in this project's toolchain, so every iOS build, archive and
# TestFlight upload happens here, and the Android build runs alongside it so
# one pushed tag produces both. See docs/release.md for the one-time setup
# each workflow depends on.
#
# Two workflows:
#   ios-testflight  build, test, archive and upload to TestFlight
#   android-play    build, test, sign and upload an app bundle to Play's internal track
workflows:
  ios-testflight:
    name: HomeKind iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # "latest" is deliberate: HomeKind ships no server, so there is no
      # compatibility matrix to pin against, and Capacitor 8 / iOS need a
      # current Xcode.
      xcode: latest
      node: lts
      vars:
        XCODE_PROJECT: 'ios/App/App.xcodeproj'
        XCODE_SCHEME: 'App'
        BUNDLE_ID: 'ai.wattkind.homekind'
      # Signing is done by the explicit "Fetch or create signing files" step
      # below rather than Codemagic's automatic ios_signing block, because the
      # automatic step aborts the build before any script runs and hides the
      # reason Apple gave. The explicit step needs one secret: the private key
      # used for the distribution certificate, stored once in Codemagic as the
      # secure variable CERTIFICATE_PRIVATE_KEY in the group "ios_signing".
      # See docs/release.md for how to create it.
      groups:
        - ios_signing
    integrations:
      # Name of the App Store Connect integration configured once in the
      # Codemagic UI under Team settings > Integrations. Must be named
      # exactly "HomeKind" there; see docs/release.md.
      app_store_connect: HomeKind
    triggering:
      # Manual by default (Start new build in the Codemagic UI), plus any
      # pushed tag matching v* (e.g. v1.0.0) starts a build automatically.
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.npm

    scripts:
      - name: npm ci
        script: npm ci

      - name: npm run lint
        script: npm run lint

      - name: npm run typecheck
        script: npm run typecheck

      - name: npm test
        script: npm test

      - name: npm run build
        script: npm run build

      - name: npx cap sync ios
        script: npx cap sync ios

      - name: Fetch or create signing files
        # Explicit so the log shows what App Store Connect answered. Uses the
        # credentials Codemagic exports from the App Store Connect integration
        # (APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        # APP_STORE_CONNECT_PRIVATE_KEY). --create registers a distribution
        # certificate and an App Store profile for the bundle id if none exist.
        script: |
          set -e
          echo "--- Bundle ids matching $BUNDLE_ID on this team"
          app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID"
          echo "--- Existing distribution certificates"
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true
          echo "--- Existing App Store profiles"
          app-store-connect list-profiles --type IOS_APP_STORE || true
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is not set. Add it as a secure variable in the"
            echo "Codemagic group 'ios_signing' (see docs/release.md), then start a new build."
            exit 1
          fi
          echo "--- Fetching or creating certificate and profile"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain initialize
          keychain add-certificates

      - name: xcode-project use-profiles
        script: xcode-project use-profiles

      - name: Set build number from Codemagic build number
        # Every TestFlight upload needs a unique CFBundleVersion. Codemagic
        # exposes a monotonically increasing build number as $BUILD_NUMBER;
        # agvtool writes it into the Xcode project as CURRENT_PROJECT_VERSION.
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: xcode-project build-ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-play:
    name: HomeKind Android Play
    max_build_duration: 45
    # The same machine type as the iOS workflow: Codemagic's Mac images ship the Android
    # SDK and JDKs too, and it is the instance type this account's billing plan allows
    # (linux_x2 was refused with "not available with the current billing plan").
    instance_type: mac_mini_m2
    environment:
      # Capacitor 8 compiles with Java 21 (android/app/capacitor.build.gradle).
      java: 21
      node: lts
      # The Play upload keystore, uploaded once in the Codemagic UI under
      # Team settings > Code signing identities > Android keystores with the reference
      # name "homekind_upload". Codemagic then exports CM_KEYSTORE_PATH,
      # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and CM_KEY_PASSWORD, which
      # android/app/build.gradle reads. See docs/release.md.
      android_signing:
        - homekind_upload
      groups:
        # Holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: the JSON key of the Google Cloud
        # service account that Play Console grants release access. See docs/release.md.
        - google_play
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches

    scripts:
      - name: npm ci
        script: npm ci

      - name: npm run lint
        script: npm run lint

      - name: npm run typecheck
        script: npm run typecheck

      - name: npm test
        script: npm test

      - name: npm run build
        script: npm run build

      - name: npx cap sync android
        script: npx cap sync android

      - name: Check the upload keystore is present
        script: |
          set -e
          if [ -z "${CM_KEYSTORE_PATH:-}" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "No Android keystore was injected. Add the upload keystore in Codemagic under"
            echo "Team settings > Code signing identities > Android keystores with the reference"
            echo "name 'homekind_upload' (see docs/release.md), then start a new build."
            exit 1
          fi

      - name: Build the signed release bundle
        # Every Play upload needs a strictly higher versionCode. Codemagic's $BUILD_NUMBER is
        # monotonic for this app, the same counter the iOS workflow uses for CFBundleVersion.
        script: |
          cd android
          ./gradlew bundleRelease -PHOMEKIND_VERSION_CODE="$BUILD_NUMBER" --no-daemon

      - name: Show what was declared
        # The merged manifest is what Play reads. HomeKind should request INTERNET only.
        script: |
          cat android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml \
            | grep -E "uses-permission|versionCode|versionName" || true

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Internal testing only. Promotion to closed testing or production is done by hand
        # in Play Console, the same way App Store submission is done by hand.
        track: internal
        submit_as_draft: false
